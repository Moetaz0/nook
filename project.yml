# XcodeGen : `brew install xcodegen && xcodegen && open Nook.xcodeproj`
name: Nook
options:
  bundleIdPrefix: app.nook
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: fr
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
targets:
  Nook:
    type: application
    platform: iOS
    sources: [Nook]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nook.Nook
        INFOPLIST_FILE: Nook/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - { package: Firebase, product: FirebaseAuth }
      - { package: Firebase, product: FirebaseFirestore }
      - { package: GoogleSignIn, product: GoogleSignIn }
      - { package: GoogleMobileAds, product: GoogleMobileAds }
schemes:
  Nook:
    build: { targets: { Nook: all } }
    run: { storeKitConfiguration: Nook/Resources/Nook.storekit }
