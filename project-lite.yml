# Variante SANS packages (mode démo). `xcodegen --spec project-lite.yml`
# XcodeGen : `brew install xcodegen && xcodegen && open Nook.xcodeproj`
name: Nook
options:
  bundleIdPrefix: app.nook
  deploymentTarget: { iOS: "17.0" }
  developmentLanguage: fr
targets:
  Nook:
    type: application
    platform: iOS
    sources: [Nook]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nook.Nook
        INFOPLIST_FILE: Nook/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  Nook:
    build: { targets: { Nook: all } }
    run: { storeKitConfiguration: Nook/Resources/Nook.storekit }
